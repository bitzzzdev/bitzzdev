name: Update Tulkun

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - ascii
      - preview

permissions:
  contents: write

jobs:
  tulkun:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Tulkun
        uses: PramudithaN/git-tulkun@v1
        with:
          view: side
          window: annual
