stages:
  - verify

default:
  image: node:20
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/

build:
  stage: verify
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "ascii"
    - if: $CI_COMMIT_BRANCH == "preview"
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_PIPELINE_SOURCE == "web"

# The Tulkun activity banner is generated from GitHub contribution data by the
# GitHub Actions workflow in .github/workflows/tulkun.yml. It is not mirrored
# here because the generator reads GitHub-specific account activity.
